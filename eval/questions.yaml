# ---------- tricky (wording and naming traps)
- id: t1
  category: tricky
  question: What's KAY/O's win rate on Bind in 2024?
  gold_sql: |
    SELECT round(100.0 * avg((result = 'win')::INT), 1) AS win_rate_pct FROM fact_team_comp
    WHERE year = 2024 AND map_name = 'Bind' AND agent_name = 'kayo'
- id: t2
  category: tricky
  question: Which duelist had the highest pick count at international events in 2022?
  gold_sql: |
    SELECT c.agent_name, count(*) AS picks FROM fact_team_comp c JOIN dim_agent a USING (agent_name) JOIN dim_event e USING (event_id)
    WHERE e.year = 2022 AND e.is_international AND a.role = 'duelist' GROUP BY 1 ORDER BY 2 DESC LIMIT 1
- id: t3
  category: tricky
  question: how many maps was jett picked on in 2024
  gold_sql: |
    SELECT count(DISTINCT game_id) FROM fact_team_comp WHERE year = 2024 AND agent_name = 'jett'
- id: t4
  category: tricky
  question: Which teams beat Sentinels on Lotus in 2025?
  gold_sql: |
    SELECT DISTINCT w.team_name FROM fact_map_result m JOIN dim_team s ON s.team_id IN (m.team_a_id, m.team_b_id)
    JOIN dim_team w ON w.team_id = m.winner_team_id
    WHERE m.year = 2025 AND m.map_name = 'Lotus' AND s.team_name = 'Sentinels' AND w.team_id <> s.team_id

