# ---------- join
- id: j1
  category: join
  question: Which team had the highest map win rate in 2024, among teams with at least 30 maps?
  gold_sql: |
    WITH played AS (
      SELECT t.team_name, (m.winner_team_id = t.team_id)::INT AS won FROM fact_map_result m
      JOIN dim_team t ON t.team_id IN (m.team_a_id, m.team_b_id) WHERE m.year = 2024)
    SELECT team_name, round(100.0 * avg(won), 1) AS win_rate_pct FROM played GROUP BY 1 HAVING count(*) >= 30
    ORDER BY 2 DESC LIMIT 1
- id: j2
  category: join
  question: Which players played at least 50 maps for Paper Rex in 2025?
  gold_sql: |
    SELECT p.player_name FROM fact_player_map f JOIN fact_map_result m USING (match_map_id)
    JOIN dim_player p USING (player_id) JOIN dim_team t ON t.team_id = f.team_id
    WHERE m.year = 2025 AND t.team_name = 'Paper Rex' GROUP BY 1 HAVING count(*) >= 50
