# Test set: questions with hand-written correct SQL ("gold"). gold_sql: null means the right
# behavior is to refuse or say "no data" (the question can't be answered from this data).
# Categories: simple, filter, aggregate, join, tricky, impossible.
# Gold results contain only the columns the question asks for (extra answer columns are ignored).

# ---------- simple
- id: s1
  category: simple
  question: How many maps were played at Valorant Champions 2024?
  gold_sql: |
    SELECT count(DISTINCT m.match_map_id) FROM fact_map_result m JOIN dim_event e USING (event_id)
    WHERE e.event_name = 'Valorant Champions 2024'
- id: s2
  category: simple
  question: How many different agents were played in 2025?
  gold_sql: |
    SELECT count(DISTINCT agent_name) FROM fact_team_comp WHERE year = 2025
- id: s3
  category: simple
  question: Which map was played the most in 2024?
  gold_sql: |
    SELECT map_name, count(*) AS maps FROM fact_map_result WHERE year = 2024 GROUP BY 1 ORDER BY 2 DESC LIMIT 1
- id: s4
  category: simple
  question: How many maps went to overtime in 2025?
  gold_sql: |
    SELECT count(*) FROM fact_map_result WHERE year = 2025 AND went_overtime
- id: s5
  category: simple
  question: What role is Tejo?
  gold_sql: |
    SELECT role FROM dim_agent WHERE agent_name = 'tejo'
- id: s6
  category: simple
  question: How many international events were there in 2023?
  gold_sql: |
    SELECT count(*) FROM dim_event WHERE year = 2023 AND is_international
- id: s7
  category: simple
  question: How many teams played at Valorant Champions 2025?
  gold_sql: |
    SELECT count(DISTINCT t) FROM (
      SELECT team_a_id AS t FROM fact_map_result m JOIN dim_event e USING (event_id) WHERE e.event_name = 'Valorant Champions 2025'
      UNION SELECT team_b_id FROM fact_map_result m JOIN dim_event e USING (event_id) WHERE e.event_name = 'Valorant Champions 2025')
- id: s8
  category: simple
  question: Which map was played the most in 2023?
  gold_sql: |
    SELECT map_name, count(*) AS maps FROM fact_map_result WHERE year = 2023 GROUP BY 1 ORDER BY 2 DESC LIMIT 1

# ---------- filter
- id: f1
  category: filter
  question: Which players had more than 400 kills on Jett in 2025?
  gold_sql: |
    SELECT p.player_name FROM fact_player_map f
    JOIN fact_map_result m USING (match_map_id) JOIN dim_player p USING (player_id)
    WHERE m.year = 2025 AND f.agent_name = 'jett' GROUP BY 1 HAVING sum(f.kills) > 400
