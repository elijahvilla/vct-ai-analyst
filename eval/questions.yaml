# ---------- aggregate
- id: a1
  category: aggregate
  question: Which 5 agents had the highest pick rate at Valorant Champions 2024?
  gold_sql: |
    WITH ev AS (SELECT event_id FROM dim_event WHERE event_name = 'Valorant Champions 2024'),
    maps AS (SELECT count(*) AS n FROM fact_map_result WHERE event_id IN (SELECT event_id FROM ev))
    SELECT agent_name, round(100.0 * count(DISTINCT (game_id, team_id)) / (2 * (SELECT n FROM maps)), 1) AS pick_rate_pct
    FROM fact_team_comp WHERE event_id IN (SELECT event_id FROM ev)
    GROUP BY 1 ORDER BY 2 DESC LIMIT 5
- id: a2
  category: aggregate
  question: Which agent had the highest win rate on Lotus in 2025, among agents picked at least 30 times?
  gold_sql: |
    SELECT agent_name, round(100.0 * avg((result = 'win')::INT), 1) AS win_rate_pct FROM fact_team_comp
    WHERE year = 2025 AND map_name = 'Lotus' GROUP BY 1 HAVING count(*) >= 30 ORDER BY 2 DESC LIMIT 1
- id: a3
